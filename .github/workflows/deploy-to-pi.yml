name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - speed_manage
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PI_SERVICE_NAME: ${{ secrets.PI_SERVICE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST: 192.168.178.48
          PI_PORT: 22
        run: |
          : "${PI_SSH_KEY:?Missing GitHub secret PI_SSH_KEY}"
          : "${PI_HOST:?Missing GitHub secret PI_HOST}"
          mkdir -p ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/pi_key
          chmod 600 ~/.ssh/pi_key
          ssh-keyscan -p "$PI_PORT" "$PI_HOST" >> ~/.ssh/known_hosts

      - name: Upload project files
        env:
          PI_HOST: 192.168.178.48
          PI_USER: ${{ secrets.PI_USER }}
          PI_PORT: 22
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
        run: |
          : "${PI_USER:?Missing GitHub secret PI_USER}"
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf - . \
            | ssh -i ~/.ssh/pi_key -p "$PI_PORT" "$PI_USER@$PI_HOST" \
              "mkdir -p '$PI_DEPLOY_PATH' && tar -xzf - -C '$PI_DEPLOY_PATH'"

      - name: Restart robot service
        if: ${{ env.PI_SERVICE_NAME != '' }}
        env:
          PI_HOST: 192.168.178.48
          PI_USER: ${{ secrets.PI_USER }}
          PI_PORT: 22
          PI_SERVICE_NAME: ${{ secrets.PI_SERVICE_NAME }}
        run: |
          ssh -i ~/.ssh/pi_key -p "$PI_PORT" "$PI_USER@$PI_HOST" \
            "sudo systemctl restart '$PI_SERVICE_NAME'"
